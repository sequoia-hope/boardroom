[package]
name = "intent"
version.workspace = true
edition = "2021"
license.workspace = true

# The intent schema: Rust types that are the one definition shared by the validator, the
# tools and (through the generated JSON Schema) the router and the agent.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
