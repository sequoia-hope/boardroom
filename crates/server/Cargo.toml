[package]
name = "server"
description = "Boardroom's HTTP server: the API, the apps under one origin, the terminals"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
project = { path = "../project" }
axum = { version = "0.8", features = ["ws"] }
board-interface = { git = "https://github.com/sequoia-hope/board-interface", tag = "v0.2.2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "net", "fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
notify = "8"
httpdate = "1"
portable-pty = "0.9"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
