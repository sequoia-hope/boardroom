[package]
name = "examine"
version.workspace = true
edition = "2021"
license.workspace = true

# The judge (docs/one-system-spec.md): the two scoreboards, like the designers and sound. It
# starts as Circuit Composer's verifier, whose fast tier is this:
# The verifier's fast tier: physics proxies measured on KiCad geometry in milliseconds, so they
# can run inside placement loops as well as at sign-off.

[dependencies]
board = { path = "../board" }
intent = { path = "../intent" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
