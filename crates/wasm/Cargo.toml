[package]
name = "wasm"
description = "Boardroom's one WASM module for the browser: a board file drawn (BoardView), and a scene built from JS (SceneBoard)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
board = { path = "../board" }
render = { path = "../render" }
scene = { path = "../scene" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
