# ---- easy2350 settings (stackup.md, brief.md) ----

[fab]
min_track_mm = 0.09          # JLC 4-layer 1 oz: 0.09 (capabilities page, 2026-10-23); router neck-downs at QFN pads
min_clearance_mm = 0.1       # JLC 4-layer 1 oz: 0.09
min_via_drill_mm = 0.2       # 0.5/0.2 signal vias: JLC no surcharge with a >= 0.45 pad (stackup.md)

[copper]
outer_oz = 1.0               # JLC04161H-7628
inner_oz = 0.5
via_drill_mm = 0.3           # default via 0.6/0.3

[silk]
designators = "none"         # decisions.md: the top is too dense; labels + assembly drawing instead
identity = ["name", "rev", "date", "repo", "license"]

[placement]
decoupler_mm = 4.5           # centre to centre; the vendor RP2350 layout we copy puts C12 (our C11) 4.1 mm from pin 53
crystal_mm = 8.0             # vendor layout: Y1 12.4 mm below U1's centre; ours is 10 mm, XIN pad 7.4 mm from pin 21
keep_apart = [["U3", "Y1", 5.0], ["U3", "D3", 5.0], ["U3", "J1", 0.5]]   # ldo-3v3.md: LDO heat away from crystal and pixels; J1 see decisions.md
