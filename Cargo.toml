# Boardroom: one program, many crates (docs/one-system-spec.md).
[workspace]
resolver = "3"
members = ["crates/*", "gpl/kicad-text"]
# boardroom-gtk needs GTK 4 and WebKitGTK 6.0 headers; build it with `-p boardroom-gtk`.
default-members = ["crates/boardroom", "crates/project", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3

# The old router's tests route whole boards, and its checks are the board model's: unoptimised
# they take forty minutes between them (two of them eleven and thirteen), so these are built
# optimised under `cargo test` too. Debug assertions stay on.
[profile.dev.package.board]
opt-level = 3
[profile.dev.package.kicad]
opt-level = 3
[profile.dev.package.grid]
opt-level = 3
[profile.dev.package.morph]
opt-level = 3
[profile.dev.package.topo]
opt-level = 3
[profile.dev.package.ultraroute]
opt-level = 3
