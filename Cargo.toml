# Boardroom: one program, many crates (docs/one-system-spec.md).
[workspace]
resolver = "3"
members = ["crates/*", "gpl/kicad-text"]
# boardroom-gtk needs GTK 4 and WebKitGTK 6.0 headers; build it with `-p boardroom-gtk`.
default-members = ["crates/boardroom", "crates/project", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
