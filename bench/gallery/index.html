<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Gallery of routed boards</title>
<style>
:root{color-scheme:dark}
body{font:15px/1.45 system-ui,sans-serif;margin:0;padding:12px 14px 40px;background:#12151b;color:#dde1e7}
a{color:#8fc1ff}h1{font-size:1.3em;margin:.2em 0}.m{color:#98a1ad;font-size:.9em}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center}
button,select,input{font:inherit;color:inherit;background:#1e232c;border:1px solid #39414d;border-radius:6px;padding:5px 10px}
button.on{background:#2f5d9a;border-color:#5b93dc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:#1a1e26;border:1px solid #2b323c;border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;display:block}
.card .t{padding:6px 8px}.card b{display:block;overflow-wrap:anywhere;font-weight:600;font-size:.92em}
.bad{color:#ff8a7a}.good{color:#7fd69a}.warn{color:#f0c35a}
.none{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#000;color:#98a1ad;padding:8px;text-align:center;font-size:.85em}
table{border-collapse:collapse;margin:6px 0}td,th{padding:2px 12px 2px 0;text-align:left}
</style></head><body>
<p class="m"><a href="../../planned/">Review pages</a></p>
<h1>Gallery of routed boards</h1>
<p id="what" class="m"></p>
<table id="sum"></table>
<div class="bar" id="chips"></div>
<div class="bar">
 <input id="q" placeholder="Find a board by name" size="22">
 <select id="sort">
  <option value="open">Most open first</option><option value="worse">Most worse than before first</option>
  <option value="better">Most improved first</option><option value="layers">Most layers first</option><option value="name">By name</option>
 </select>
 <button id="copy">Copy my notes</button><span id="n" class="m"></span>
</div>
<div class="grid" id="grid"></div>
<script>
const note = id => localStorage.getItem('gallery-note:' + id) || '';
const whole = b => !b.missing && b.open === 0 && !b.new;
const clean = b => b.designer && b.designer.open === 0 && !b.designer.errors;
let data, filter = 'all', group = null;
const filters = {
  all: ['All', b => true],
  open: ['Does not pass DRC', b => !whole(b)],
  worse: ['Worse than before', b => b.was != null && b.open != null && b.open > b.was],
  better: ['Better than before', b => b.was != null && b.open != null && b.open < b.was],
  clean: ['Designer passes DRC, we do not', b => clean(b) && !whole(b)],
  errors: ['KiCad errors on our board', b => b.new > 0],
  flag: ['Looks wrong to the agent', b => b.flag],
  notes: ['Has my notes', b => note(b.id)],
};
function shown() {
  const q = document.getElementById('q').value.toLowerCase();
  let l = data.boards.filter(b => filters[filter][1](b) && (!group || b.group === group) && b.id.toLowerCase().includes(q));
  const by = document.getElementById('sort').value, o = b => b.open == null ? -1 : b.open, d = b => b.was == null || b.open == null ? 0 : b.open - b.was;
  l.sort({open: (a, b) => o(b) - o(a), worse: (a, b) => d(b) - d(a), better: (a, b) => d(a) - d(b), layers: (a, b) => b.layers - a.layers, name: () => 0}[by] || (() => 0));
  return l;
}
function draw() {
  const chips = document.getElementById('chips'); chips.textContent = '';
  for (const [k, [label, f]] of Object.entries(filters)) {
    const n = data.boards.filter(b => f(b) && (!group || b.group === group)).length;
    const el = document.createElement('button'); el.textContent = `${label} (${n})`; el.className = k === filter ? 'on' : '';
    el.onclick = () => { filter = k; draw(); }; chips.append(el);
  }
  for (const g of [...new Set(data.boards.map(b => b.group))]) {
    const el = document.createElement('button'); el.textContent = 'Run: ' + g; el.className = g === group ? 'on' : '';
    el.onclick = () => { group = group === g ? null : g; draw(); }; chips.append(el);
  }
  const l = shown(), grid = document.getElementById('grid'); grid.textContent = '';
  sessionStorage.setItem('gallery-list', JSON.stringify(l.map(b => b.id)));
  document.getElementById('n').textContent = `${l.length} boards shown`;
  for (const b of l) {
    const a = document.createElement('a'); a.className = 'card'; a.href = 'board.html?id=' + encodeURIComponent(b.id);
    const state = b.missing ? `<span class="bad">${b.missing}</span>` : whole(b) ? '<span class="good">passes DRC</span>'
      : `<span class="bad">${b.open} open</span>` + (b.new ? ` <span class="warn">${b.new} KiCad errors</span>` : '');
    const was = b.was == null || b.open == null || b.was === b.open ? '' : ` <span class="${b.open > b.was ? 'bad' : 'good'}">(was ${b.was})</span>`;
    const des = !b.designer ? '' : `<br><span class="m">designer: ${clean(b) ? 'passes DRC' : `${b.designer.open} open, ${b.designer.errors} errors`}</span>`;
    a.innerHTML = (b.missing ? `<div class="none">no picture</div>` : `<img loading="lazy" src="b/${encodeURIComponent(b.id)}/thumb.png" alt="">`)
      + `<div class="t"><b></b>${state}${was} <span class="m">· ${b.layers} layers</span>${des}`
      + (b.flag ? `<br><span class="warn">Agent: </span><span class="m f"></span>` : '') + (note(b.id) ? '<br><span class="warn">My note: </span><span class="m n"></span>' : '') + '</div>';
    a.querySelector('b').textContent = b.id;
    if (b.flag) a.querySelector('.f').textContent = b.flag;
    if (note(b.id)) a.querySelector('.n').textContent = note(b.id);
    grid.append(a);
  }
}
fetch('boards.json').then(r => r.json()).then(d => {
  data = d;
  document.getElementById('what').textContent = `Runs: ${d.runs.join(', ')}` + (d.before ? `. Compared with ${d.before}.` : '.') + ' Counts are KiCad\'s where it judged the board.';
  const rows = [...new Set(d.boards.map(b => b.group))].map(g => {
    const l = d.boards.filter(b => b.group === g), c = l.filter(clean);
    return `<tr><td>${g}</td><td>${l.length} boards</td><td>${l.filter(whole).length} pass DRC</td><td>${l.reduce((s, b) => s + (b.open || 0), 0)} connections open</td>`
      + `<td>${c.length ? `designer passes DRC on ${c.length}; of those we pass ${c.filter(whole).length}` : ''}</td></tr>`;
  });
  document.getElementById('sum').innerHTML = rows.join('');
  draw();
});
document.getElementById('q').oninput = draw; document.getElementById('sort').onchange = draw;
document.getElementById('copy').onclick = () => {
  const lines = data.boards.filter(b => note(b.id)).map(b => `${b.id}: ${note(b.id)}`);
  navigator.clipboard.writeText(lines.join('\n')).then(() => { document.getElementById('n').textContent = `${lines.length} notes copied: paste them to Claude`; });
};
</script></body></html>
