# The web-only Boardroom on GitHub Pages: the single-window app reading a
# static snapshot of the example projects, KiCad files and Composer's placement
# problems included; changes are kept in the browser (web/store/store.js).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Examples in other repos follow their branch; rebuild daily to pick them up.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The toolchain is pinned in rust-toolchain.toml.
      - run: rustup show

      # ccomp makes each board's placement problem for Composer (compose/<board>/problem.json).
      - name: Fetch circuit-composer
        run: git clone --quiet --depth 1 https://github.com/sequoia-hope/circuit-composer ../circuit-composer

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../circuit-composer

      - name: Build ccomp
        run: cargo build --release --quiet --manifest-path ../circuit-composer/Cargo.toml -p ccomp

      # The Board tab draws the .kicad_pcb with Boardroom's own WASM module (crates/wasm).
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build the WASM module
        run: web/scripts/wasm.sh

      - name: Build the static page
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:pages

      # The store in Chrome (the runner's own): revisions, conflicts, workspaces, the zip.
      - name: Test the store
        working-directory: web
        run: npm run test:store

      # The bar over the drawn tabs once the board is changed in the tab.
      - name: Test the stale bar
        working-directory: web
        run: npm run test:stale

      # The Board tab drawing the worked example's .kicad_pcb, and drawing it again after a save.
      - name: Test the board drawing
        working-directory: web
        run: npm run test:board

      # examples.toml names each example by a path here or by its own repo and
      # ref; the repo ones are cloned for this build only (no submodules).
      - name: Fetch the examples
        id: examples
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, subprocess, tomllib
          folders = []
          for ex in tomllib.load(open("examples.toml", "rb"))["examples"]:
              if "path" in ex:
                  folders.append(ex["path"])
                  continue
              dest = os.path.join("..", "examples-src", ex["name"])
              subprocess.run(["git", "clone", "--quiet", "--depth", "1", "--branch", ex.get("ref", "main"),
                              ex["repo"], dest], check=True)
              folders.append(dest)
          print("folders=" + " ".join(folders))
          EOF

      - name: Snapshot the examples into it
        env:
          CCOMP: ../circuit-composer/target/release/ccomp
        run: |
          cargo run --quiet -- \
            snapshot web/dist-pages/snapshot ${{ steps.examples.outputs.folders }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
