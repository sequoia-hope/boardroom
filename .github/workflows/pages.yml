# The web-only Boardroom on GitHub Pages: the single-window app reading a
# static snapshot of the example project (examples/easy2350). It can look but
# not act; the desktop app is what opens folders, KiCad and the other apps.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/server

      - name: Build the static page
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run build:pages

      - name: Snapshot the example project into it
        run: |
          cargo run --quiet --manifest-path app/server/Cargo.toml -- \
            snapshot app/web/dist-pages/snapshot examples/easy2350

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
